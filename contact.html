<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact - Nexus University</title>
  <link rel="stylesheet" href="style.css.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand"><span class="brand-mark">NX</span> Nexus University</div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="scholarships.html">Scholarships</a>
        <a href="apply.html">Apply Now</a>
        <a href="media.html">Media</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About Us</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero small-hero">
      <div class="container">
        <span class="eyebrow">Get in touch</span>
        <h1>Contact Nexus University.</h1>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div class="contact-form-wrap">
          <form class="contact-form">
            <input type="text" placeholder="Full name" />
            <input type="email" placeholder="Email address" />
            <input type="text" placeholder="Subject" />
            <textarea rows="5" placeholder="Your message"></textarea>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>

        <div class="info-card contact-card">
          <h3>Contact details</h3>
          <p>Email: info@nexusuniversity.com</p>
          <p>Phone: +000 000 0000</p>
          <p>Office hours: Mon - Sat, 9:00 AM - 5:00 PM</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Nexus University. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
