<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apply Now - Nexus University</title>
  <link rel="stylesheet" href="style.css.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <div class="brand"><span class="brand-mark">NX</span> Nexus University</div>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="courses.html">Courses</a>
        <a href="scholarships.html">Scholarships</a>
        <a href="apply.html">Apply Now</a>
        <a href="media.html">Media</a>
        <a href="contact.html">Contact</a>
        <a href="about.html">About Us</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero small-hero">
      <div class="container">
        <span class="eyebrow">Start your journey</span>
        <h1>Apply now.</h1>
      </div>
    </section>

    <section class="section">
      <div class="container form-card">
        <form class="contact-form">
          <div class="form-row">
            <input type="text" placeholder="Full name" />
            <input type="email" placeholder="Email address" />
          </div>
          <div class="form-row">
            <input type="text" placeholder="Country of interest" />
            <input type="text" placeholder="Programme / interest" />
          </div>
          <textarea rows="5" placeholder="Tell us about your goals and study interests"></textarea>
          <button type="submit" class="btn btn-primary">Submit Application</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Nexus University. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
